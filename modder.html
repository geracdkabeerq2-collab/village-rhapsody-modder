<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乡村狂想曲 · 存档修改器</title>
<style>
:root {
  --bg: #f5f1e8;
  --card: #ffffff;
  --ink: #2b2620;
  --sub: #8a8074;
  --line: #e8e0d2;
  --accent: #c98a3d;
  --accent2: #7a9e4d;
  --red: #d94f3d;
  --green: #4d9e5a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #3d3428 0%, #5a4a35 100%);
  color: #f5e9d0;
  padding: 22px 32px;
  box-shadow: 0 2px 12px rgba(0,0,0,.18);
}
header h1 {
  font-size: 24px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 12px;
}
header h1 .icon { font-size: 28px; }
header .sub { font-size: 13px; color: #c9b98f; margin-top: 6px; }
.container { max-width: 1180px; margin: 24px auto; padding: 0 24px; }
.toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 18px; margin-bottom: 20px;
}
.toolbar label { font-size: 14px; color: var(--sub); }
.toolbar select {
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 14px; background: #fff; min-width: 220px;
}
.btn {
  padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 600; transition: .15s; letter-spacing: .5px;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.15); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-green { background: var(--accent2); color: #fff; }
.btn-red { background: var(--red); color: #fff; }
.btn-ghost { background: #f0ebe0; color: var(--ink); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.status {
  margin-left: auto; font-size: 13px; padding: 8px 14px; border-radius: 20px;
  background: #eef4e6; color: var(--green);
}
.status.err { background: #fbeae7; color: var(--red); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,.04);
}
.card h2 {
  font-size: 17px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  padding-bottom: 10px; border-bottom: 2px solid var(--line);
}
.card h2 .tag { font-size: 12px; color: var(--sub); font-weight: normal; margin-left: auto; }
.card.full { grid-column: 1 / -1; }

/* 道具面板 */
.prop-head { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.prop-head input {
  width: 120px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px;
}
.prop-select {
  flex: 1; min-width: 200px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px;
}
.prop-head input[placeholder="数量"] { width: 100px; }
.prop-list { max-height: 420px; overflow-y: auto; }
.prop-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-bottom: 1px solid #f3eee4; font-size: 14px;
}
.prop-item:hover { background: #faf6ee; }
.prop-item .pid { color: var(--sub); font-size: 12px; width: 42px; flex-shrink: 0; }
.prop-item .pname { flex: 1; }
.prop-item input {
  width: 80px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
  font-size: 13px; text-align: center;
}
.prop-item .apply { font-size: 12px; color: var(--accent); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.prop-item .apply:hover { background: #f5e8d5; }

/* NPC面板 */
.npc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.npc-item {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
}
.npc-item .nname { flex: 1; font-size: 14px; }
.npc-item .stars { display: flex; gap: 3px; }
.npc-item .star { font-size: 18px; cursor: pointer; color: #ddd; transition: .1s; }
.npc-item .star.on { color: #f5b731; }
.npc-item .star:hover { transform: scale(1.2); }

/* CG面板 */
.cg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cg-item {
  border: 2px solid var(--line); border-radius: 10px; padding: 12px 8px;
  text-align: center; font-size: 13px; cursor: pointer; transition: .15s;
}
.cg-item.locked { opacity: .45; }
.cg-item.unlocked { border-color: var(--green); background: #f0f7ec; }
.cg-item:hover { border-color: var(--accent); }

/* 体力面板 */
.phy-box { text-align: center; padding: 20px; }
.phy-num { font-size: 48px; font-weight: 700; color: var(--accent); }
.phy-label { color: var(--sub); margin: 8px 0 16px; }

.msg {
  position: fixed; top: 20px; right: 20px; padding: 14px 20px; border-radius: 10px;
  color: #fff; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  transform: translateX(120%); transition: .3s; z-index: 999; max-width: 380px;
}
.msg.show { transform: translateX(0); }
.msg.ok { background: var(--green); }
.msg.err { background: var(--red); }
.tip { font-size: 12px; color: #b0a594; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1><span class="icon">🌾</span> 乡村狂想曲 · 存档修改器</h1>
  <div class="sub">全道具 · NPC好感度 · CG画廊 · 体力补满 —— 修改前请先关闭游戏</div>
</header>

<div class="container">
  <div class="toolbar">
    <label>存档：</label>
    <select id="saveSelect" onchange="loadData()"></select>
    <button class="btn btn-ghost btn-sm" onclick="loadData()">🔄 刷新</button>
    <div class="status" id="status">等待操作…</div>
  </div>

  <div class="grid">
    <!-- 道具 -->
    <div class="card full">
      <h2>🎒 全道具数量 <span class="tag">knapData</span></h2>
      <div class="prop-head">
        <select id="propSelect" class="prop-select"></select>
        <input type="number" id="propNumInput" min="0" placeholder="数量">
        <button class="btn btn-primary btn-sm" onclick="setCustomProp()">设定该道具</button>
      </div>
      <div class="prop-head">
        <button class="btn btn-green btn-sm" onclick="setAllProps()">全部设为指定数量</button>
        <input type="number" id="allPropNum" value="999" min="0">
        <button class="btn btn-primary btn-sm" onclick="setAllProps()">一键应用</button>
      </div>
      <div class="prop-list" id="propList"></div>
    </div>

    <!-- NPC好感度 -->
    <div class="card">
      <h2>💗 NPC 好感度 <span class="tag">npcData · starNum</span></h2>
      <div class="prop-head">
        <button class="btn btn-green btn-sm" onclick="setAllNpc(5)">全部满好感(5星)</button>
        <button class="btn btn-ghost btn-sm" onclick="setAllNpc(3)">全部3星</button>
        <button class="btn btn-ghost btn-sm" onclick="setAllNpc(0)">全部清零</button>
      </div>
      <div class="npc-grid" id="npcList"></div>
    </div>

    <!-- CG画廊 -->
    <div class="card">
      <h2>🖼️ CG 画廊 <span class="tag">unlockCgList</span></h2>
      <div class="prop-head">
        <button class="btn btn-green btn-sm" onclick="unlockAllCg()">解锁全部 CG</button>
      </div>
      <div class="cg-grid" id="cgList"></div>
    </div>

    <!-- 体力 -->
    <div class="card full">
      <h2>⚡ 体力值 <span class="tag">attributeData</span></h2>
      <div class="phy-box">
        <div class="phy-num" id="phyNum">--</div>
        <div class="phy-label">当前体力 / 上限 100</div>
        <button class="btn btn-red" onclick="fillPhysical()">🔋 补满体力</button>
      </div>
      <div class="tip">
        ⚠️ 使用说明：<br>
        1. 修改前请<b>先关闭游戏</b>；<br>
        2. 每次保存会自动备份原存档到 <code>data/_backup/</code> 目录；<br>
        3. 若游戏运行中修改可能导致存档被覆盖，请务必先退出游戏。
      </div>
    </div>
  </div>
</div>

<div class="msg" id="msg"></div>

<script>
let META = null;
let CUR = null;  // 当前选中的存档数据

const API = 'http://127.0.0.1:8765';

function showMsg(text, isErr) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg show ' + (isErr ? 'err' : 'ok');
  clearTimeout(m._t);
  m._t = setTimeout(() => m.className = 'msg', 3000);
}
function setStatus(text, isErr) {
  const s = document.getElementById('status');
  s.textContent = text;
  s.className = 'status' + (isErr ? ' err' : '');
}

async function loadData() {
  setStatus('加载中…');
  try {
    const r = await fetch(API + '/api/data');
    const d = await r.json();
    if (!d.ok) { showMsg(d.error, true); setStatus('加载失败', true); return; }
    META = d.meta;
    // 填充存档下拉
    const sel = document.getElementById('saveSelect');
    sel.innerHTML = '';
    d.saves.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.file;
      opt.textContent = s.file + (s.error ? ' (读取失败)' : '');
      sel.appendChild(opt);
    });
    if (d.saves.length === 0) {
      showMsg('未找到存档，请先启动游戏创建存档', true);
      setStatus('无存档', true);
      return;
    }
    CUR = d.saves[0];
    render();
    setStatus('已加载：' + d.saves[0].file);
  } catch (e) {
    showMsg('无法连接后端服务，请确认 server.py 已启动', true);
    setStatus('连接失败', true);
  }
}

function render() {
  if (!CUR || !META) return;
  renderProps();
  renderNpc();
  renderCg();
  renderPhy();
}

function renderProps() {
  const el = document.getElementById('propList');
  // 建立 id->name 映射
  const nameMap = {};
  (META.props || []).forEach(p => nameMap[p.id] = p.name);
  // 合并：存档里的道具 + 元数据里的道具
  const props = [...(CUR.props || [])];
  el.innerHTML = '';
  if (props.length === 0) { el.innerHTML = '<div class="tip">暂无道具</div>'; }
  else {
    props.forEach(p => {
      const name = nameMap[p.id] || ('道具 #' + p.id);
      const div = document.createElement('div');
      div.className = 'prop-item';
      div.innerHTML = `
        <span class="pid">#${p.id}</span>
        <span class="pname">${name}</span>
        <input type="number" value="${p.num}" min="0" id="prop_${p.id}">
        <span class="apply" onclick="applyProp(${p.id})">应用</span>
      `;
      el.appendChild(div);
    });
  }
  // 渲染自定义道具选择器（全部道具，排除金币）
  const sel = document.getElementById('propSelect');
  if (sel && !sel._rendered) {
    sel.innerHTML = '';
    (META.props || []).forEach(p => {
      if (p.id === 1) return; // 金币单独在「金钱」面板改
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `#${p.id} ${p.name}`;
      sel.appendChild(opt);
    });
    sel._rendered = true;
  }
}

function renderNpc() {
  const el = document.getElementById('npcList');
  const nameMap = {};
  (META.npc || []).forEach(n => nameMap[n.id] = n.name);
  const npcs = [...(CUR.npcs || [])];
  el.innerHTML = '';
  npcs.forEach(n => {
    const name = nameMap[n.npcId] || ('NPC #' + n.npcId);
    const star = n.starNum || 0;
    let starsHtml = '';
    for (let i = 1; i <= 5; i++) {
      starsHtml += `<span class="star ${i <= star ? 'on' : ''}" onclick="applyNpc(${n.npcId}, ${i})">★</span>`;
    }
    const div = document.createElement('div');
    div.className = 'npc-item';
    div.innerHTML = `
      <span class="nname">${name}</span>
      <span class="stars">${starsHtml}</span>
    `;
    el.appendChild(div);
  });
}

function renderCg() {
  const el = document.getElementById('cgList');
  const unlocked = new Set(CUR.cg || []);
  el.innerHTML = '';
  (META.cg || []).forEach(c => {
    const isUnlocked = unlocked.has(c.key);
    const div = document.createElement('div');
    div.className = 'cg-item ' + (isUnlocked ? 'unlocked' : 'locked');
    div.innerHTML = `${c.name}${isUnlocked ? ' ✓' : ''}`;
    div.title = isUnlocked ? '已解锁' : '未解锁';
    el.appendChild(div);
  });
}

function renderPhy() {
  document.getElementById('phyNum').textContent = CUR.physical || '--';
}

async function post(action, body) {
  const file = document.getElementById('saveSelect').value;
  setStatus('操作中…');
  try {
    const r = await fetch(API + '/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file, action, ...body })
    });
    const d = await r.json();
    if (d.ok) {
      showMsg(d.msg || '操作成功');
      loadData();
    } else {
      showMsg(d.error || '操作失败', true);
      setStatus('操作失败', true);
    }
  } catch (e) {
    showMsg('请求失败：' + e, true);
    setStatus('操作失败', true);
  }
}

function applyProp(id) {
  const num = parseInt(document.getElementById('prop_' + id).value) || 0;
  post('set_prop', { id, num });
}
function setCustomProp() {
  const id = parseInt(document.getElementById('propSelect').value);
  const num = parseInt(document.getElementById('propNumInput').value);
  if (isNaN(num) || num < 0) { toast('请输入有效数量', true); return; }
  post('set_prop', { id, num });
}
function setAllProps() {
  const num = parseInt(document.getElementById('allPropNum').value) || 0;
  post('set_all_props', { num });
}
function applyNpc(id, star) {
  post('set_npc_star', { id, star });
}
function setAllNpc(star) {
  post('set_all_npc_star', { star });
}
function unlockAllCg() {
  post('unlock_all_cg', {});
}
function fillPhysical() {
  post('fill_physical', {});
}

loadData();
</script>
</body>
</html>
